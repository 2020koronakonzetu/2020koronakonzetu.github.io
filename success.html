<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>決済完了</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 30px; background-color: #f8f9fa; }
    .container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; border-top: 5px solid #28a745; }
    .number { font-size: 32px; font-weight: bold; color: #d9534f; letter-spacing: 2px; margin: 20px 0; }

  <div class="container">
    <h2>決済が完了しました</h2>

  </div>

</html>
